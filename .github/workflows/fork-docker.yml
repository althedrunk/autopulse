name: Fork Docker

# Publishes this fork's image to ghcr.io/<owner>/autopulse. Upstream's
# delivery workflows are disabled in the fork because they push to the
# upstream registries.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fork-docker
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    name: Build and push linux/amd64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Build binary
        run: cargo build --locked --release --features vendored --target ${{ env.TARGET }}

      - name: Copy binary
        run: |
          cp target/${{ env.TARGET }}/release/autopulse ./autopulse
          file ./autopulse

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autopulse" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
